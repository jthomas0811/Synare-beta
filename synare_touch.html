<style>
/* Layout: one full-screen pad (the drum head); logo above, live readout below; nothing to adjust, only to play */
:root {
  --ground: #0d0c0b;     /* the unit's black, warmed */
  --head: #161412;       /* the pad surface */
  --ring: #2a2622;       /* pad rings, grid */
  --ink: #e9e3d9;        /* panel lettering */
  --dim: #8a837a;        /* secondary text */
  --lamp: #ff7319;       /* the Synare lamp orange */
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }  /* no double-tap zoom anywhere */
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--ink); font-family: var(--display); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.app { height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header img { height: 22px; width: auto; display: block; }
header .tag { font: 500 12px var(--mono); letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
#pad { flex: 1; min-height: 0; width: 100%; display: block; border-radius: 18px; background: var(--head); touch-action: none !important; }
footer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; font: 400 11px var(--mono); color: var(--dim); }
footer b { display: block; font: 500 15px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
footer .meter { height: 3px; background: var(--ring); border-radius: 2px; margin-top: 6px; position: relative; overflow: hidden; }
footer .meter i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--lamp); border-radius: 2px; }
#note { font: 400 11px var(--mono); color: var(--dim); text-align: center; min-height: 14px; }
#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--ground) 92%, transparent); z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#start .card { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
#go { width: 168px; height: 168px; border-radius: 50%; border: 1px solid var(--ring); cursor: pointer;
  background: radial-gradient(circle at 50% 42%, #24201c 0%, #141210 62%, #0b0a09 100%); color: var(--ink);
  font: 700 20px var(--display); letter-spacing: 0.16em; text-transform: uppercase; box-shadow: 0 0 0 10px #12100e, 0 0 0 11px var(--ring); }
#go:focus-visible { outline: 2px solid var(--lamp); outline-offset: 14px; }
#go span { color: var(--lamp); }
.how { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font: 400 13px var(--mono); color: var(--dim); text-align: left; }
.how dt { color: var(--ink); font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }
.how dd { margin: 0; }
#err { color: var(--lamp); font: 400 12px var(--mono); }
</style>

// ---------- mappings ----------
const FMIN = 70, FMAX = 2500;                         // pad width: 70 Hz (left) to 2.5 kHz (right), log
const xToHz = x => FMIN * Math.pow(FMAX / FMIN, x);
const hzToX = f => Math.log(Math.max(f, 1) / FMIN) / Math.log(FMAX / FMIN);
const strike = u => Math.pow(0.31 + 0.69 * u, 2);     // tap height to strike: bottom = lightest blip in the Shaka clip, top = full hit
const S = { x: hzToX(150), dec: 0, wob: 0 };

  const d = S.dec, fk = 63 + (d > 0 ? 27 : 28) * d, ak = 58 + 32 * d;   // Filter Decay 35..90, Amp Decay 26..90 (home 63 / 58)
  return { fdec_s: 0.005 + Math.pow(fk / 100, 2), adec_s: 0.005 + 2.2 * Math.pow(ak / 100, 2), o2mod_hz: 700 * S.wob };
}

  send(); await ctx.resume();
}
async function keepAwake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) { wake = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx) { ctx.resume(); keepAwake(); } });

// desktop testing: arrow keys for decay and wobble
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') S.dec = Math.min(1, S.dec + 0.1); else if (e.key === 'ArrowDown') S.dec = Math.max(-1, S.dec - 0.1);
  else if (e.key === 'ArrowRight') S.wob = Math.min(1, S.wob + 0.1); else if (e.key === 'ArrowLeft') S.wob = Math.max(0, S.wob - 0.1); else return;
  e.preventDefault(); send();
});

// ---------- the pad ----------
const pad = document.getElementById('pad'), g = pad.getContext('2d');
// iPhone Safari: fast taps would zoom the page. Swallow the touch gestures so only the pad's own handling runs.
for (const ev of ['touchstart', 'touchmove', 'touchend']) pad.addEventListener(ev, e => e.preventDefault(), { passive: false });
for (const ev of ['gesturestart', 'gesturechange', 'dblclick']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
let lastEnd = 0;
document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastEnd < 350) e.preventDefault(); lastEnd = now; }, { passive: false });
let W = 0, Hh = 0, dpr = 1;
function size() { dpr = window.devicePixelRatio || 1; W = pad.clientWidth; Hh = pad.clientHeight; pad.width = Math.round(W * dpr); pad.height = Math.round(Hh * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0); }
window.addEventListener('resize', size);
// one finger is the stick (strikes, pitch, decay); a second finger held down is the wobble
let stick = null, wob = null; const ripples = [];   // stick: {id,x,y,y0,d0}; wob: {id,x,y}
function rel(e) { const r = pad.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
function wobDepth() {
  if (!wob) return 0; const s = stick || lastStick; if (!s) return 0;
  const d = Math.hypot((wob.x - s.x) * W, (wob.y - s.y) * Hh) / Math.hypot(W, Hh);
  return Math.max(0, Math.min(1, (d - 0.06) / 0.5));
}
let lastStick = null;
pad.addEventListener('pointerdown', e => {
  if (!ctx) return; e.preventDefault(); pad.setPointerCapture(e.pointerId);
  const [x, y] = rel(e);
  if (stick && !wob) { wob = { id: e.pointerId, x, y }; S.wob = wobDepth(); send(); return; }
  if (stick) return;
  stick = { id: e.pointerId, x, y, y0: y, d0: S.dec }; lastStick = stick;
  S.x = Math.max(0, Math.min(1, x)); send(); hit(strike(Math.max(0, Math.min(1, 1 - y))));
  ripples.push({ x: x * W, y: y * Hh, t: performance.now(), u: Math.max(0, Math.min(1, 1 - y)) });
});
pad.addEventListener('pointermove', e => {
  const [x, y] = rel(e);
  if (stick && e.pointerId === stick.id) {
    stick.x = x; stick.y = y; S.x = Math.max(0, Math.min(1, x));
    S.dec = Math.max(-1, Math.min(1, stick.d0 + (stick.y0 - y) / 0.35));   // a third of the pad's height covers the decay range
  } else if (wob && e.pointerId === wob.id) { wob.x = x; wob.y = y; } else return;
  S.wob = wobDepth(); send();
});
function lift(e) {
  if (stick && e.pointerId === stick.id) { lastStick = { x: stick.x, y: stick.y }; stick = null; }
  else if (wob && e.pointerId === wob.id) { wob = null; S.wob = 0; send(); }
}
pad.addEventListener('pointerup', lift); pad.addEventListener('pointercancel', lift);

const trail = [];                                      // pitch history: newest at the top, falling down the pad
const GRID = [100, 200, 500, 1000, 2000];
function draw(now) {
  g.clearRect(0, 0, W, Hh);
  const cx = W / 2, cy = Hh / 2, R = Math.hypot(W, Hh) / 2;
  for (let k = 1; k <= 4; k++) { g.beginPath(); g.arc(cx, cy, R * k / 4.6, 0, 7); g.strokeStyle = 'rgba(255,240,220,0.035)'; g.lineWidth = 1; g.stroke(); }
  g.font = '400 10px "IBM Plex Mono", monospace'; g.textAlign = 'center';
  for (const f of GRID) { const x = hzToX(f) * W; g.fillStyle = 'rgba(255,240,220,0.06)'; g.fillRect(x, 0, 1, Hh); g.fillStyle = '#5c5650'; g.fillText(f >= 1000 ? f / 1000 + 'k' : String(f), x, Hh - 10); }
  g.save(); g.translate(14, Hh / 2); g.rotate(-Math.PI / 2); g.fillStyle = '#5c5650'; g.textAlign = 'center';
  g.fillText('SOFT  ·  STRIKE  ·  HARD', 0, 0); g.restore();
  // the floor: where the dive lands (your finger's pitch)
  const fx = S.x * W; g.fillStyle = 'rgba(255,115,25,0.22)'; g.fillRect(fx - 0.75, 0, 1.5, Hh);
  // pitch trail
  trail.unshift({ fc: live.fc, a: live.amp }); if (trail.length > 240) trail.pop();
  const step = Hh / 240;
  for (let i = 1; i < trail.length; i++) {
    const p0 = trail[i - 1], p1 = trail[i], al = Math.min(1, p0.a * 1.6);
    if (al < 0.02) continue;
    g.beginPath(); g.moveTo(hzToX(p0.fc) * W, (i - 1) * step); g.lineTo(hzToX(p1.fc) * W, i * step);
    g.strokeStyle = `rgba(255,115,25,${al * (1 - i / 260)})`; g.lineWidth = 1.5 + 4 * al; g.lineCap = 'round'; g.stroke();
  }
  // strikes
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i], t = (now - rp.t) / 600; if (t > 1) { ripples.splice(i, 1); continue; }
    g.beginPath(); g.arc(rp.x, rp.y, 12 + (30 + 90 * rp.u) * t, 0, 7); g.strokeStyle = `rgba(255,115,25,${(1 - t) * 0.8})`; g.lineWidth = 2; g.stroke();
  }
  if (stick) {                                        // decay drag: a line from where the finger landed
    g.beginPath(); g.moveTo(stick.x * W, stick.y0 * Hh); g.lineTo(stick.x * W, stick.y * Hh); g.strokeStyle = 'rgba(233,227,217,0.25)'; g.lineWidth = 1; g.stroke();
    g.beginPath(); g.arc(stick.x * W, stick.y * Hh, 22, 0, 7); g.strokeStyle = 'rgba(233,227,217,0.6)'; g.lineWidth = 1.5; g.stroke();
  }
  if (wob) {
    const s = stick || lastStick;
    if (s) { g.beginPath(); g.moveTo(s.x * W, s.y * Hh); g.lineTo(wob.x * W, wob.y * Hh); g.strokeStyle = `rgba(255,115,25,${0.25 + 0.6 * S.wob})`; g.lineWidth = 1 + 3 * S.wob; g.setLineDash([4, 6]); g.stroke(); g.setLineDash([]); }
    g.beginPath(); g.arc(wob.x * W, wob.y * Hh, 18 + 6 * Math.sin(now / 32), 0, 7); g.strokeStyle = 'rgba(255,115,25,0.7)'; g.lineWidth = 1.5; g.stroke();
  }
  // readouts
  const hz = xToHz(S.x), k = knobsFromTilt();
  document.getElementById('rPitch').textContent = (hz >= 1000 ? (hz / 1000).toFixed(2) + ' kHz' : Math.round(hz) + ' Hz');
  document.getElementById('mPitch').style.width = (S.x * 100).toFixed(1) + '%';
  document.getElementById('rDecay').textContent = k.fdec_s.toFixed(2) + ' s';
  document.getElementById('mDecay').style.width = ((S.dec + 1) * 50).toFixed(1) + '%';
  document.getElementById('rWob').textContent = S.wob > 0.01 ? Math.round(S.wob * 100) + '%' : 'off';
  document.getElementById('mWob').style.width = (S.wob * 100).toFixed(1) + '%';
  const note = document.getElementById('note');
  note.textContent = ctx && !stick && !wob ? 'Pitch and decay stay where you leave them, like knobs.' : '';
  requestAnimationFrame(draw);
}
size(); requestAnimationFrame(draw);

document.getElementById('go').addEventListener('click', async () => {
  const err = document.getElementById('err');
  try { const a = startAudio(); document.getElementById('start').hidden = true; size(); keepAwake(); await a; }
  catch (e) { document.getElementById('start').hidden = false; err.hidden = false; err.textContent = 'This browser could not start audio. Try Safari or Chrome.'; }
});
</script>
</body></html>
